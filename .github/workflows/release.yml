name: Build release packages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-packages
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            command: npm run dist -- --publish never
            files: dist/*.exe
          - os: ubuntu-22.04
            platform: linux
            command: npm run dist:linux -- --publish never
            files: |
              dist/linux/*.AppImage
              dist/linux/*.deb
          - os: macos-latest
            platform: mac
            command: npm run dist:mac -- --publish never
            files: |
              dist/mac/*.dmg
              dist/mac/*.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Desktop workflow checks
        if: matrix.platform == 'windows'
        run: |
          npm run test:ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:shell
      - name: Build native packages
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.platform }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  prepare-release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          path: release-assets
      - name: Prepare draft and checksums
        run: node scripts/prepare-release.cjs
        env:
          GH_TOKEN: ${{ github.token }}

